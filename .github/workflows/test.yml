name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # No gofmt gate yet: the tree is committed with CRLF endings, which
      # gofmt reports as unformatted across every pre-existing file. Worth
      # normalising, but not as a side effect of this change.

      - name: go vet
        run: go vet ./...

      # -race matters here: the retry path is exercised by every resource in
      # an apply at once.
      - name: go test
        run: go test -race -count=1 ./...
